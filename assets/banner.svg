<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <!-- aeris-tiler banner: AerisOS black/white, Swiss 12-column grid, 3 | 6 | 3 windows. -->
  <rect width="1280" height="640" fill="#0a0a0a"/>

  <!-- Bar strip, as sketchybar draws it -->
  <text x="24" y="22" font-family="Sohne" font-weight="700" font-size="17" fill="#ffffff">Æ</text>
  <text x="58" y="21" font-family="Sohne" font-weight="400" font-size="13" fill="#e6e6e6">1</text>
  <rect x="76" y="11" width="10" height="10" fill="#ffffff"/>
  <text x="98" y="21" font-family="Sohne" font-weight="400" font-size="13" fill="#e6e6e6">3</text>
  <text x="124" y="21" font-family="Sohne Mono, Menlo, Apple Symbols" font-weight="400" font-size="12" fill="#7a7a7a">GRID</text>
  <text x="1256" y="21" font-family="Sohne Mono, Menlo, Apple Symbols" font-weight="400" font-size="12" fill="#e6e6e6" text-anchor="end">SAT 14 NOV  12:00</text>
  <rect x="0" y="32" width="1280" height="1" fill="#1c1c1c"/>

  <!-- Left: mark and name -->
  <text x="60" y="300" font-family="Sohne" font-weight="700" font-size="210" fill="#ffffff">Æ</text>
  <text x="64" y="380" font-family="Sohne Mono, Menlo, Apple Symbols" font-weight="400" font-size="46" fill="#ffffff">aeris-tiler</text>
  <text x="64" y="418" font-family="Sohne" font-weight="400" font-size="22" fill="#e6e6e6">Hyprland-style tiling for macOS</text>

  <!-- Layout chips: the current one inverted, like notable values on the AerisOS bar -->
  <text x="64" y="496" font-family="Sohne Mono, Menlo, Apple Symbols" font-weight="400" font-size="15" fill="#7a7a7a">TILE</text>
  <rect x="112" y="480" width="54" height="22" fill="#ffffff"/>
  <text x="139" y="496" font-family="Sohne Mono, Menlo, Apple Symbols" font-weight="400" font-size="15" fill="#0a0a0a" text-anchor="middle">GRID</text>
  <text x="178" y="496" font-family="Sohne Mono, Menlo, Apple Symbols" font-weight="400" font-size="15" fill="#7a7a7a">FLOAT</text>
  <text x="64" y="568" font-family="Sohne Mono, Menlo, Apple Symbols" font-weight="400" font-size="14" fill="#7a7a7a">yabai · skhd · hammerspoon · sketchybar</text>

  <!-- Right: 12 columns (x 536..1216, 12 px gutters) -->
  <g fill="#101010">
    <rect x="536" y="80" width="45.67" height="488"/><rect x="593.67" y="80" width="45.67" height="488"/>
    <rect x="651.33" y="80" width="45.67" height="488"/><rect x="709" y="80" width="45.67" height="488"/>
    <rect x="766.67" y="80" width="45.67" height="488"/><rect x="824.33" y="80" width="45.67" height="488"/>
    <rect x="882" y="80" width="45.67" height="488"/><rect x="939.67" y="80" width="45.67" height="488"/>
    <rect x="997.33" y="80" width="45.67" height="488"/><rect x="1055" y="80" width="45.67" height="488"/>
    <rect x="1112.67" y="80" width="45.67" height="488"/><rect x="1170.33" y="80" width="45.67" height="488"/>
  </g>
  <g font-family="Sohne Mono, Menlo, Apple Symbols" font-weight="400" font-size="10" fill="#4a4a4a" text-anchor="middle">
    <text x="558.8" y="70">01</text><text x="616.5" y="70">02</text><text x="674.2" y="70">03</text>
    <text x="731.8" y="70">04</text><text x="789.5" y="70">05</text><text x="847.2" y="70">06</text>
    <text x="904.8" y="70">07</text><text x="962.5" y="70">08</text><text x="1020.2" y="70">09</text>
    <text x="1077.8" y="70">10</text><text x="1135.5" y="70">11</text><text x="1193.2" y="70">12</text>
  </g>

  <!-- Windows: sides 2 stacked, middle 1 (the grid's rule for 5 windows) -->
  <g fill="#121212" stroke="#5a5a5a" stroke-width="1.5">
    <rect x="536.75" y="80.75" width="159.5" height="236.5"/>
    <rect x="536.75" y="330.75" width="159.5" height="236.5"/>
    <rect x="1055.75" y="80.75" width="159.5" height="236.5"/>
    <rect x="1055.75" y="330.75" width="159.5" height="236.5"/>
  </g>
  <g fill="#3a3a3a">
    <circle cx="550" cy="94" r="3"/><circle cx="560" cy="94" r="3"/><circle cx="570" cy="94" r="3"/>
    <circle cx="550" cy="344" r="3"/><circle cx="560" cy="344" r="3"/><circle cx="570" cy="344" r="3"/>
    <circle cx="1069" cy="94" r="3"/><circle cx="1079" cy="94" r="3"/><circle cx="1089" cy="94" r="3"/>
    <circle cx="1069" cy="344" r="3"/><circle cx="1079" cy="344" r="3"/><circle cx="1089" cy="344" r="3"/>
  </g>
  <g fill="#1e1e1e">
    <rect x="550" y="114" width="120" height="6"/><rect x="550" y="128" width="90" height="6"/>
    <rect x="550" y="364" width="110" height="6"/><rect x="550" y="378" width="70" height="6"/>
    <rect x="1069" y="114" width="100" height="6"/><rect x="1069" y="128" width="120" height="6"/>
    <rect x="1069" y="364" width="80" height="6"/><rect x="1069" y="378" width="110" height="6"/>
  </g>

  <!-- Focused middle window -->
  <rect x="710.25" y="81.25" width="331.5" height="485.5" fill="#161616" stroke="#ffffff" stroke-width="2.5"/>
  <circle cx="726" cy="96" r="3.5" fill="#e6e6e6"/><circle cx="738" cy="96" r="3.5" fill="#e6e6e6"/><circle cx="750" cy="96" r="3.5" fill="#e6e6e6"/>
  <g font-family="Sohne Mono, Menlo, Apple Symbols" font-weight="400" font-size="13" fill="#e6e6e6">
    <text x="726" y="140">$ layout</text>
    <text x="726" y="162" fill="#7a7a7a">GRID</text>
    <text x="726" y="196">$ tile</text>
    <text x="726" y="230">$ hold</text>
    <text x="783" y="231" font-family="Apple Symbols" font-size="16" letter-spacing="2">⌘⌃→</text>
  </g>
  <rect x="726" y="240" width="9" height="16" fill="#ffffff"/>

  <!-- Resize: the border moves in the arrow's direction -->
  <path d="M968 324 H1026" stroke="#ffffff" stroke-width="2.5"/>
  <path d="M1016 314 L1030 324 L1016 334" fill="none" stroke="#ffffff" stroke-width="2.5"/>
  <text x="1042" y="590" font-family="Sohne Mono, Menlo, Apple Symbols" font-weight="400" font-size="11" fill="#4a4a4a" text-anchor="end">3 | 6 | 3</text>
</svg>
