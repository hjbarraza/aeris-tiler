<svg xmlns="http://www.w3.org/2000/svg" width="560" height="340" viewBox="0 0 560 340">
  <!-- Aeris Tiler disk image window: AerisOS black/white, Swiss 12-column grid.
       Finder puts the app icon at (158, 152) and the Applications folder at (402, 152).
       Render: rsvg-convert dmg-background.svg -o bg.png; rsvg-convert -z 2 dmg-background.svg -o bg@2x.png;
               tiffutil -cathidpicheck bg.png bg@2x.png -out dmg-background.tiff -->
  <rect width="560" height="340" fill="#0a0a0a"/>

  <!-- Bar strip -->
  <text x="40" y="21" font-family="Sohne, Helvetica Neue" font-weight="700" font-size="14" fill="#ffffff">Æ</text>
  <text x="66" y="20" font-family="Sohne Mono, Menlo, Apple Symbols" font-weight="400" font-size="10" fill="#7a7a7a">INSTALL</text>
  <text x="520" y="20" font-family="Sohne Mono, Menlo, Apple Symbols" font-weight="400" font-size="10" fill="#7a7a7a" text-anchor="end">hjbarraza.com · astraed.co</text>
  <rect x="0" y="32" width="560" height="1" fill="#1c1c1c"/>

  <!-- 12 columns (x 40..520, 8 px gutters) -->
  <g fill="#101010"><rect x="40.00" y="60" width="32.67" height="202"/><rect x="80.67" y="60" width="32.67" height="202"/><rect x="121.33" y="60" width="32.67" height="202"/><rect x="162.00" y="60" width="32.67" height="202"/><rect x="202.67" y="60" width="32.67" height="202"/><rect x="243.34" y="60" width="32.67" height="202"/><rect x="284.00" y="60" width="32.67" height="202"/><rect x="324.67" y="60" width="32.67" height="202"/><rect x="365.34" y="60" width="32.67" height="202"/><rect x="406.00" y="60" width="32.67" height="202"/><rect x="446.67" y="60" width="32.67" height="202"/><rect x="487.34" y="60" width="32.67" height="202"/></g>
  <g font-family="Sohne Mono, Menlo, Apple Symbols" font-weight="400" font-size="7" fill="#4a4a4a" text-anchor="middle"><text x="56.3" y="52">01</text><text x="97.0" y="52">02</text><text x="137.7" y="52">03</text><text x="178.3" y="52">04</text><text x="219.0" y="52">05</text><text x="259.7" y="52">06</text><text x="300.3" y="52">07</text><text x="341.0" y="52">08</text><text x="381.7" y="52">09</text><text x="422.3" y="52">10</text><text x="463.0" y="52">11</text><text x="503.7" y="52">12</text></g>

  <!-- Finder draws the icon names in black: white chips behind them keep them readable -->
  <rect x="114" y="204" width="88" height="20" fill="#ffffff"/>
  <rect x="354" y="204" width="96" height="20" fill="#ffffff"/>

  <!-- From the app to the Applications folder -->
  <path d="M252 152 H306" stroke="#ffffff" stroke-width="2"/>
  <path d="M297 143 L308 152 L297 161" fill="none" stroke="#ffffff" stroke-width="2"/>

  <text x="39" y="300" font-family="Sohne, Helvetica Neue" font-weight="600" font-size="22" fill="#ffffff">Drag Aeris Tiler to Applications</text>
  <text x="40" y="320" font-family="Sohne Mono, Menlo, Apple Symbols" font-weight="400" font-size="10" fill="#7a7a7a">THEN OPEN IT FROM APPLICATIONS</text>
</svg>
